<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobtrack{% endblock %}</title>
<style>
  :root { --ink:#1c2530; --muted:#6a7784; --accent:#0f766e; --line:#e2e8f0; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink:#e6edf3; --muted:#9aa7b4; --line:#2b3644; --bg:#0f1720; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  nav { display:flex; gap:16px; margin-bottom:24px; border-bottom:1px solid var(--line);
        padding-bottom:10px; flex-wrap:wrap; }
  nav a { color:var(--accent); text-decoration:none; font-weight:600; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px;
       text-transform:uppercase; letter-spacing:.04em; padding:8px 10px;
       border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .num { font-variant-numeric:tabular-nums; text-align:right; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px;
          font-weight:600; border:1px solid var(--line); }
  .s-sent{color:var(--muted)} .s-viewed{color:#0369a1;border-color:#0369a1}
  .s-rejected{color:#b45309;border-color:#b45309} .s-ghosted{color:#9ca3af}
  .s-invited,.s-interview,.s-test_task,.s-offer{color:#047857;border-color:#047857}
  form.add { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
             gap:8px; margin:0 0 26px; padding:14px; border:1px solid var(--line);
             border-radius:8px; }
  input,select,textarea,button { font:inherit; padding:7px 9px; border:1px solid var(--line);
             border-radius:6px; background:var(--bg); color:var(--ink); width:100%; }
  button { background:var(--accent); color:#fff; border-color:var(--accent);
           font-weight:600; cursor:pointer; }
  label { font-size:11.5px; color:var(--muted); display:block; margin-bottom:3px; }
  .silent { color:#b45309; font-weight:600; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/">Подачі</a>
    <a href="/funnel">Воронка</a>
    <a href="/docs">API</a>
  </nav>
  {% block body %}{% endblock %}
</div>
</body>
</html>
